<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Acesso restrito · Agent Center</title>
    <style>
        :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f6fa; color: #182538; }
        main { width: 100%; max-width: 520px; padding: 36px; border: 1px solid #d6deea; border-radius: 20px; background: #fff; }
        .brand { margin: 0 0 28px; color: #526279; font-size: 14px; font-weight: 600; }
        h1 { margin: 0 0 16px; font-size: clamp(26px, 6vw, 34px); line-height: 1.2; }
        p { line-height: 1.65; }
        a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 10px; background: #164eaf; color: #fff; font-weight: 600; text-decoration: none; }
        a:hover { background: #103e8e; }
        a:focus-visible { outline: 3px solid #b26d00; outline-offset: 4px; }
        small { display: block; margin-top: 28px; color: #526279; }
        @media (prefers-color-scheme: dark) {
            body { background: #101725; color: #edf2fa; }
            main { background: #192337; border-color: #3c4c65; }
            .brand, small { color: #bcc9dc; }
        }
        @media (max-width: 400px) { main { padding: 24px; } }
    </style>
</head>
<body>
    <main>
        <p class="brand">Agent Center</p>
        <h1>Acesso restrito</h1>
        <p>Você não tem permissão para acessar esta página.</p>
        <p>Se você precisa de acesso, entre em contato com o administrador para conferir as permissões da sua conta e a liberação da sua conexão.</p>
        <a href="/login">Ir para o login</a>
        <small>Código do erro: 403</small>
    </main>
</body>
</html>
