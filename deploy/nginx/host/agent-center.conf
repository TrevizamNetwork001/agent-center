# Dedicated vhost. Other sites and firewall rules remain unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name agente.trevizamnetwork.com.br;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/agent-center-acme; try_files $uri =404; }
    location / { return 308 https://agente.trevizamnetwork.com.br$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agente.trevizamnetwork.com.br;
    ssl_certificate /etc/letsencrypt/live/agent-center/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent-center/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/agent-center-error.log crit;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; connect-src 'self'" always;
    client_max_body_size 2m;
    include /etc/nginx/snippets/agent-center-access.conf;
    location / {
        proxy_pass http://127.0.0.1:18083;
        proxy_set_header Host agente.trevizamnetwork.com.br;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
