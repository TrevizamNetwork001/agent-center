# Dedicated vhost. Other sites and firewall rules remain unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name agente.trevizamnetwork.com.br;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/agent-center-acme; try_files $uri =404; }
    location / { return 308 https://agente.trevizamnetwork.com.br$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agente.trevizamnetwork.com.br;
    ssl_certificate /etc/letsencrypt/live/agent-center/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent-center/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    access_log /var/log/nginx/agent-center-status.log agent_center_status_only;
    error_log /var/log/nginx/agent-center-error.log crit;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; connect-src 'self'" always;
    client_max_body_size 2m;
    include /etc/nginx/snippets/agent-center-access.conf;
    # Public Agent distribution; no tenant credentials in these artifacts.
    location ~ "^/(?:instalar/?|instalar/(?:index[.]html|guide[.]js)|instalar-agent[.]sh|instalar-agent-auto[.]py|downloads/agent/0[.]5[.]3/(?:agent-center-agent-0[.]5[.]3[.]tar[.]gz|SHA256SUMS)|downloads/agent/0[.]5[.]5/(?:agent-center-agent-0[.]5[.]5[.]tar[.]gz|SHA256SUMS)|downloads/agent/0[.]5[.]6/(?:agent-center-agent-0[.]5[.]6[.]tar[.]gz|SHA256SUMS)|downloads/agent/0[.]5[.]7/(?:agent-center-agent-0[.]5[.]7[.]tar[.]gz|SHA256SUMS)|downloads/agent/0[.]5[.]8/(?:agent-center-agent-0[.]5[.]8[.]tar[.]gz|SHA256SUMS)|downloads/agent/0[.]5[.]9/(?:agent-center-agent-0[.]5[.]9[.]tar[.]gz|SHA256SUMS)|downloads/agent/0[.]6[.]0/(?:agent-center-agent-0[.]6[.]0[.]tar[.]gz|SHA256SUMS)|downloads/agent/0[.]6[.]1/(?:agent-center-agent-0[.]6[.]1[.]tar[.]gz|SHA256SUMS)|downloads/agent/releases/[a-f0-9]{64}[.]pyz)$" {
        allow all;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18083;
        proxy_set_header Host agente.trevizamnetwork.com.br;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    # Existing Laravel code/receipt/token authentication and rate limits apply.
    location ~ ^/api/v1/agent/(?:bootstrap/(?:request|status)|enroll|enrollment-status|heartbeat|capabilities|claim|reconcile|start|renew|result|operations/(?:claim|report))$ {
        allow all;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18083;
        proxy_set_header Host agente.trevizamnetwork.com.br;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:18083;
        proxy_set_header Host agente.trevizamnetwork.com.br;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
