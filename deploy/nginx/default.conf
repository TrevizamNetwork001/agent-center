# TLS futuro: configurar domínio/certificados e redirecionar HTTP somente após validação.
log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log /dev/stdout safe;
    error_log /dev/stderr crit;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    client_max_body_size 2m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
        set $central_fpm web:9000;
        fastcgi_pass $central_fpm;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
