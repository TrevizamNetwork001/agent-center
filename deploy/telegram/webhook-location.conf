# Rollout candidate only: include inside the existing HTTPS Agent Center server.
# This exception exposes only the authenticated Telegram ingress, never the panel.
location ~ "^/api/telegram/[1-9][0-9]*/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$" {
    allow all;
    limit_except POST { deny all; }
    client_max_body_size 32k;
    client_body_buffer_size 32k;
    access_log off;
    proxy_pass http://127.0.0.1:18083;
    proxy_set_header Host agente.trevizamnetwork.com.br;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}
