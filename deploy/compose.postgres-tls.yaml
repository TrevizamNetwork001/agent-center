# Compatibility overlay. RECOVERY-8 already requires TLS in the base Compose.
# Do not use old optional overlays: all five application workloads inherit verify-full.
services:
  postgres:
    command: [postgres, -c, timezone=Europe/Berlin, -c, log_statement=none, -c, ssl=on, -c, ssl_min_protocol_version=TLSv1.2, -c, ssl_cert_file=/run/pg-tls/server.crt, -c, ssl_key_file=/run/pg-tls/server.key, -c, hba_file=/run/pg-tls/pg_hba.conf]
