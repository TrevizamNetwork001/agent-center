[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "agent-center-agent"
version = "0.6.3"
requires-python = ">=3.13"
dependencies = []
[project.scripts]
agent-center-agent = "agent_center.main:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
